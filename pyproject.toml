[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unetultra"
version = "0.1.0"
description = "RGB + focus -> mask, distance and size, trained with LiDAR labels"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest"]
notebooks = ["jupyter", "ipywidgets", "ipympl", "matplotlib", "scikit-learn"]
sam = ["transformers>=4.56"]   # SAM 2.1 for 01_masks.ipynb
coreml = ["coremltools>=8"]    # 04_export_coreml.ipynb
all = ["unetultra[dev,notebooks,sam,coreml]"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
