[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unetultra"
version = "0.1.0"
description = "RGB + focus -> mask, distance and size, trained with LiDAR labels"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest"]
notebooks = ["jupyter", "ipywidgets", "matplotlib", "scikit-learn"]
# Added in later phases, after confirmation: SAM 2 (phase 2), coremltools (phase 5).

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
